# Work done, site issues and expenses golden set (ARCH-02; ADR section 10b).
# One JSON object per line (valid YAML flow mapping, parsed without a YAML dependency).
#
#   message  what the site sends
#   calls    the tool calls a good model makes (CI scripts these, so the save code is checked)
#   expect   the exact records saved, nothing more:
#              action  create_activity | record_site_issue | record_expense
#              fields  {name: text} -- the saved value contains the text (lower-case);
#                      a number must be equal
#   confirm  true: an expense waits on Yes/No (confirm-first): nothing is saved yet,
#            the reply ends with the confirmation
#   ask      true: nothing is saved and the reply is ONE question
#
# The live run (pytest -m live) sends `message` to the real model instead of `calls`.

- {"id": 1, "lang": "en", "message": "180 sqm plastering done on 2nd floor", "calls": [["save_work_done", {"narrative": "180 sqm plastering done on 2nd floor", "work_type": "plastering", "location": "2nd floor", "quantities": [{"work_type": "plastering", "quantity": 180, "unit": "sqm"}], "update_kind": "progress"}]], "expect": [{"action": "create_activity", "fields": {"work_type": "plaster", "location": "2nd"}}]}
