- {"id": 4, "lang": "en", "hint": "material_invoice", "message": "(They sent a photo. It shows: Tax invoice from Sharma Traders (line_items: [{\"item\": \"Cement OPC 53 grade\", \"quantity\": 50, \"unit\": \"bag\"}]; total: 21500))", "calls": [["save_material_receipt", {"material": "Cement OPC 53 grade", "quantity": 50, "unit": "bags", "supplier": "Sharma Traders"}]], "expect": [{"action": "record_material_receipt", "material": ["cement"], "quantity": 50, "unit": ["bag", "sack"]}]}
