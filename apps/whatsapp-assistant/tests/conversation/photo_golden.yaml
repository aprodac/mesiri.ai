# Photos and bills golden set (ARCH-06: photos and documents go to the agent).
# One JSON object per line (valid YAML flow mapping, parsed without a YAML dependency).
#
#   message  what the agent reads: the vision model's description of the photo
#            or document, as runtime/agent/turn.py hands it over
#   hint     the photo-purpose tap (img_* -> IMAGE_PURPOSE_SEMANTIC_HINT); none for a document
#   calls    the tool calls a good model makes (CI scripts these; 4 and 6 pass the
#            bill's trade name, which the material entry maps to the listed material)
#   expect   the exact records saved: material records as in materials_golden.yaml
#            (material / quantity / unit lists), others as in site_golden.yaml (fields)
#   confirm  true: an expense waits on Yes/No (confirm-first)
#   ask      true: nothing is saved and the reply is ONE question
#
# A supplier's invoice sent as a document with no purpose tapped is saved as
# received (save-first, Undo on the card): live, 22 Oct, the model did so and
# that is the least work for the site.
#
# The live run (pytest -m live) sends `message` and `hint` to the real model.

- {"id": 1, "lang": "en", "hint": "expense", "message": "(They sent a photo. It shows: Fuel bill from Indian Oil petrol pump (amount: 1850; vendor: Indian Oil; item: diesel; date: 22/10/2026))", "calls": [["save_expense", {"amount": 1850, "description": "diesel", "paid_to": "Indian Oil", "category": "fuel"}]], "expect": [], "confirm": true}
- {"id": 2, "lang": "en", "hint": "expense", "message": "(They sent a photo. It shows: Restaurant bill for tea and snacks (amount: 640; vendor: Hotel Saravana))", "calls": [["save_expense", {"amount": 640, "description": "tea and snacks", "paid_to": "Hotel Saravana", "category": "food"}]], "expect": [], "confirm": true}
