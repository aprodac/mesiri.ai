# Materials golden set (WA-36; ADR "Direction", section 8: the materials pilot).
# One JSON object per line (valid YAML flow mapping, parsed without a YAML dependency).
#
#   message  what the site sends
#   calls    the tool calls a good model makes (CI scripts these, so the save code is checked)
#   expect   the exact records that must be saved, nothing more:
#              action    record_material_receipt | record_material_usage | record_labour_attendance
#              material  accepted names (compared lower-case, letters and digits only)
#              quantity  exact
#              unit      accepted units (lower-case, a trailing "s" ignored)
#              supplier / work_item  must appear in the saved value (lower-case), when given
#   ask      true: nothing is saved and the reply is ONE question
#   query    true: nothing is saved and a query tool answers
#   card     true: nothing is saved; a Send / Save card (engineer question) waits on the tap
#
# The live run (pytest -m live) sends `message` to the real model instead of `calls`.

- {"id": 1, "lang": "en", "message": "50 bags cement arrived", "calls": [["save_material_receipt", {"material": "cement", "quantity": 50, "unit": "bags"}]], "expect": [{"action": "record_material_receipt", "material": ["cement"], "quantity": 50, "unit": ["bag", "sack"]}]}
