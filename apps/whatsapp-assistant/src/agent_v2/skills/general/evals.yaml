# General v2 eval set, TM-18 feedback layer (1 Nov). Same shape as the module sets (skillkit.py):
# one JSON object per line; CI runs each case's scripted `calls` through V2Runner and the real card
# code; the live run (needs GEMINI_API_KEY) sends `message` to the real model.
# A missing feature, a "bad UX" complaint and its reason are passed on with tell_the_team (the team
# bot builds it and tells the person); the guards must not call it.
- {"id": 901, "lang": "en", "message": "create a new project Green Villa", "calls": [["tell_the_team", {"kind": "missing_feature", "about": "create a project from WhatsApp"}]], "expect": [], "must_call": ["tell_the_team"], "note": "live 1 Nov: an admin was sent to the dashboard"}
- {"id": 902, "lang": "manglish", "message": "puthiya project undakkanam, Skyline ennu peru", "calls": [["tell_the_team", {"kind": "missing_feature", "about": "create a project named Skyline from WhatsApp"}]], "expect": [], "must_call": ["tell_the_team"], "note": "sibling: Manglish"}
- {"id": 903, "lang": "en", "message": "add a new site called Block B", "calls": [["tell_the_team", {"kind": "missing_feature", "about": "create a site from WhatsApp"}]], "expect": [], "must_call": ["tell_the_team"], "note": "sibling: site, not project"}
- {"id": 904, "lang": "en", "message": "this is bad UX", "calls": [["tell_the_team", {"kind": "bad_ux", "about": "the last reply"}]], "expect": [], "must_call": ["tell_the_team"], "note": "no reason given: the reply asks what was bad"}
- {"id": 905, "lang": "en", "message": "too many buttons, it's confusing", "calls": [["tell_the_team", {"kind": "bad_ux", "about": "the buttons under the last reply", "why": "too many buttons, confusing"}]], "expect": [], "must_call": ["tell_the_team"]}
- {"id": 906, "lang": "manglish", "message": "ithu sheriyalla, buttons okke confusing aanu", "calls": [["tell_the_team", {"kind": "bad_ux", "about": "the buttons under the last reply", "why": "the buttons are confusing"}]], "expect": [], "must_call": ["tell_the_team"], "note": "sibling: Manglish"}
- {"id": 907, "lang": "manglish", "message": "Green Villa: 8 mason 5 helper vannu", "calls": [["save_labour", {"workers": [{"trade": "mason", "headcount": 8}, {"trade": "helper", "headcount": 5}]}]], "expect": [{"kind": "labour", "workers": {"mason": 8, "helper": 5}}], "must_not_call": ["tell_the_team"], "note": "guard: a record is never feedback"}
- {"id": 908, "lang": "manglish", "message": "alla, 6 mason aanu", "given": [[["save_labour", {"workers": [{"trade": "mason", "headcount": 8}, {"trade": "helper", "headcount": 5}]}]]], "calls": [["change_line", {"item_index": 1, "changes": {"workers": [{"trade": "mason", "headcount": 6}]}}]], "expect": [{"kind": "labour", "workers": {"mason": 6, "helper": 5}}], "must_not_call": ["tell_the_team"], "note": "guard: a correction is fixed here, never passed on"}
