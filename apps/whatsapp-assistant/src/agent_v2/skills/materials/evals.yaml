# Materials v2 eval set (request 174, Phase C gate: >= 90% right and 0 wrong saves).
# One JSON object per line (valid YAML flow mapping, parsed without a YAML dependency).
# These are the messages of the week's failures (split cement, "cement theernnu", "5 bag
# baakki", a bare "176", mixed messages) plus their neighbours. The set in
# tests/conversation/materials_golden.yaml is run through v2 as well (live run).
#
#   message  what the site sends
#   calls    the tool calls a good v2 run makes (CI scripts these, so the card code is checked)
#   expect   the card lines that must be on the card, nothing more:
#              kind      material_in | material_out | stock_count
#              material  accepted names (lower-case, letters and digits only)
#              quantity / counted   exact
#   ask      true: no line on the card, ONE question
#   query    true: no line on the card, a stock answer
#   handback true: v2 hands the WHOLE message to today's agent (it is not only about materials)
#   figure_ok true: a figure of the message is allowed to be left for a question
#
# A WRONG SAVE is a card line that is not in `expect` (or a line when none was expected).

