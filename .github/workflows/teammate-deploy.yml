name: Deploy Teammate listener

# Installs/updates teammate/ (listener + brain) on the VPS as their own systemd
# services, separate from the Mesiri app, and exposes the token-protected inbox
# API at https://api.whatsapp.mesiri.ai/teammate/. Runs by hand, and on pushes
# to main that change bot files (TM-09: an approved upgrade from WhatsApp
# redeploys the bot by pushing). It never touches the Mesiri app itself.
#
# Needs the repository/environment secret TEAMMATE_API_TOKEN (any long random
# string; the same value goes into the Claude Code environment as
# TEAMMATE_TOKEN). See teammate/README.md.

on:
  workflow_dispatch:
    inputs:
      now:
        description: "Restart the bot now, even if a build is running (urgent fix)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "teammate/**"
      - ".github/workflows/teammate-deploy.yml"

concurrency:
  group: teammate-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # 3 Nov: a bot change that crashed at start-up (a ReferenceError in main.js) was deployed with no test run and
      # crash-looped all night: no request reached the team group. Both suites run first, including the start-up test.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the bot and the listener before deploying
        run: |
          # A variable used before its line runs (what crashed main.js on 2 Nov and post_fixed_card on 3 Nov) only
          # fails when that path runs; the lint finds every one up front.
          (cd teammate && npx --yes eslint@10.1.0 brain/src listener/src)
          (cd teammate/brain && npm ci --no-audit --no-fund && npm test)
          (cd teammate/listener && npm ci --no-audit --no-fund && npm test)

      - name: Check token secret
        env:
          TEAMMATE_API_TOKEN: ${{ secrets.TEAMMATE_API_TOKEN }}
        run: |
          if [ "${#TEAMMATE_API_TOKEN}" -lt 32 ]; then
            echo "::error::Add a TEAMMATE_API_TOKEN secret of at least 32 characters (e.g. the output of 'openssl rand -hex 32') first."
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's key, retried (2 Nov: the TM-43 bot deploy failed on one dropped scan; deploy.yml and
          # claude-ops.yml already retried since 21 Oct).
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then break; fi
            echo "ssh-keyscan attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "could not read the server's SSH key"; exit 1; }

      - name: Upload teammate/
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete --exclude node_modules --exclude data \
            -e "ssh -i ~/.ssh/deploy_key" \
            teammate/ "${VPS_USER}@${VPS_HOST}:/opt/teammate/"

      - name: Install and start the service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TEAMMATE_API_TOKEN: ${{ secrets.TEAMMATE_API_TOKEN }}
          # Optional (TM-07): voice-note transcripts and English translations.
          TEAMMATE_GEMINI_API_KEY: ${{ secrets.TEAMMATE_GEMINI_API_KEY }}
          # Optional (TM-03b): Claude Code answers in WhatsApp -- read-only while planning,
          # changes only after an approved "@bot ok" (enforced in teammate/brain/src/brain.js).
          # Both secrets are needed to switch it on.
          TEAMMATE_CLAUDE_TOKEN: ${{ secrets.TEAMMATE_CLAUDE_TOKEN }}
          TEAMMATE_GITHUB_TOKEN: ${{ secrets.TEAMMATE_GITHUB_TOKEN }}
          # Optional (hybrid): approved work for Mercon runs as a cloud routine the owner can watch.
          TEAMMATE_ROUTINE_MERCON_URL: ${{ secrets.TEAMMATE_ROUTINE_MERCON_URL }}
          TEAMMATE_ROUTINE_MERCON_TOKEN: ${{ secrets.TEAMMATE_ROUTINE_MERCON_TOKEN }}
          # TM-09: the bot's own repo (upgrades from WhatsApp) -- its token and cloud routine.
          TEAMMATE_GITHUB_TOKEN_MESIRI: ${{ secrets.TEAMMATE_GITHUB_TOKEN_MESIRI }}
          TEAMMATE_ROUTINE_MESIRI_URL: ${{ secrets.TEAMMATE_ROUTINE_MESIRI_URL }}
          TEAMMATE_ROUTINE_MESIRI_TOKEN: ${{ secrets.TEAMMATE_ROUTINE_MESIRI_TOKEN }}
          # TM-12: the routine bound to Ilan Usman's cloud session (Ilan Pro reports to it).
          TEAMMATE_PARTNER_MESIRI_URL: ${{ secrets.TEAMMATE_PARTNER_MESIRI_URL }}
          TEAMMATE_PARTNER_MESIRI_TOKEN: ${{ secrets.TEAMMATE_PARTNER_MESIRI_TOKEN }}
          # TM-16: the production watch reads Mesiri production through the read-only ops API (the same
          # secret the Mesiri deploy writes to /opt/mesiri/.env); kept out of Claude's environment by main.js.
          MESIRI_CLAUDE_OPS_TOKEN: ${{ secrets.MESIRI_CLAUDE_OPS_TOKEN }}
          RESTART_NOW: ${{ inputs.now && 'true' || 'false' }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # TM-14: more Claude accounts (B, C, …) the bot can switch to from WhatsApp. One secret, one
          # KEY=value per line: the variables above with the account's letter added, e.g.
          # CLAUDE_CODE_OAUTH_TOKEN_B=…, TEAMMATE_ROUTINE_MESIRI_URL_B=…, TEAMMATE_ROUTINE_MESIRI_TOKEN_B=…
          TEAMMATE_CLAUDE_ACCOUNTS: ${{ secrets.TEAMMATE_CLAUDE_ACCOUNTS }}
          # Optional: a dev-only test account so the bot's screenshots of dev.mercon.tech are signed in.
          TEAMMATE_DEV_LOGIN_USER: ${{ secrets.TEAMMATE_DEV_LOGIN_USER }}
          TEAMMATE_DEV_LOGIN_PASSWORD: ${{ secrets.TEAMMATE_DEV_LOGIN_PASSWORD }}
          # Optional: a test account on the Mesiri dashboard (app.whatsapp.mesiri.ai) for signed-in screenshots.
          TEAMMATE_DEV_LOGIN_MESIRI_USER: ${{ secrets.TEAMMATE_DEV_LOGIN_MESIRI_USER }}
          TEAMMATE_DEV_LOGIN_MESIRI_PASSWORD: ${{ secrets.TEAMMATE_DEV_LOGIN_MESIRI_PASSWORD }}
        run: |
          # Several lines: sent encoded, so newlines and quotes survive the ssh command line.
          TEAMMATE_CLAUDE_ACCOUNTS_B64="$(printf %s "${TEAMMATE_CLAUDE_ACCOUNTS:-}" | base64 -w0)"
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "RESTART_NOW='${RESTART_NOW}' NOTIFY_WEBHOOK_URL='${NOTIFY_WEBHOOK_URL}' TEAMMATE_CLAUDE_ACCOUNTS_B64='${TEAMMATE_CLAUDE_ACCOUNTS_B64}' TEAMMATE_API_TOKEN='${TEAMMATE_API_TOKEN}' TEAMMATE_GEMINI_API_KEY='${TEAMMATE_GEMINI_API_KEY}' TEAMMATE_CLAUDE_TOKEN='${TEAMMATE_CLAUDE_TOKEN}' TEAMMATE_GITHUB_TOKEN='${TEAMMATE_GITHUB_TOKEN}' TEAMMATE_ROUTINE_MERCON_URL='${TEAMMATE_ROUTINE_MERCON_URL}' TEAMMATE_ROUTINE_MERCON_TOKEN='${TEAMMATE_ROUTINE_MERCON_TOKEN}' TEAMMATE_GITHUB_TOKEN_MESIRI='${TEAMMATE_GITHUB_TOKEN_MESIRI}' TEAMMATE_ROUTINE_MESIRI_URL='${TEAMMATE_ROUTINE_MESIRI_URL}' TEAMMATE_ROUTINE_MESIRI_TOKEN='${TEAMMATE_ROUTINE_MESIRI_TOKEN}' TEAMMATE_PARTNER_MESIRI_URL='${TEAMMATE_PARTNER_MESIRI_URL}' TEAMMATE_PARTNER_MESIRI_TOKEN='${TEAMMATE_PARTNER_MESIRI_TOKEN}' MESIRI_CLAUDE_OPS_TOKEN='${MESIRI_CLAUDE_OPS_TOKEN}' TEAMMATE_DEV_LOGIN_USER='${TEAMMATE_DEV_LOGIN_USER}' TEAMMATE_DEV_LOGIN_PASSWORD='${TEAMMATE_DEV_LOGIN_PASSWORD}' TEAMMATE_DEV_LOGIN_MESIRI_USER='${TEAMMATE_DEV_LOGIN_MESIRI_USER}' TEAMMATE_DEV_LOGIN_MESIRI_PASSWORD='${TEAMMATE_DEV_LOGIN_MESIRI_PASSWORD}' bash -s" << 'ENDSSH'
          set -euo pipefail

          # Node >= 22.13 (node:sqlite). Install Node 22 from NodeSource if missing/older.
          need_node=1
          if command -v node >/dev/null; then
            node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>22||(a===22&&b>=13)?0:1)' && need_node=0
          fi
          if [ "$need_node" = 1 ]; then
            echo "Installing Node 22"
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          echo "node $(node --version) at $(command -v node)"

          cd /opt/teammate/listener
          npm ci --omit=dev --no-audit --no-fund

          umask 077
          printf 'TEAMMATE_API_TOKEN=%s\nTEAMMATE_HOST=127.0.0.1\nTEAMMATE_PORT=8790\n' "$TEAMMATE_API_TOKEN" > /opt/teammate/.env
          # TM-59: the second way out for alarms (an ntfy topic or a chat webhook), the uptime check's own secret.
          if [ -n "${NOTIFY_WEBHOOK_URL:-}" ]; then
            printf 'TEAMMATE_ALERT_URL=%s\n' "$(printf %s "$NOTIFY_WEBHOOK_URL" | tr -d '[:space:]')" >> /opt/teammate/.env
          fi
          if [ -n "${TEAMMATE_GEMINI_API_KEY:-}" ]; then
            printf 'TEAMMATE_GEMINI_API_KEY=%s\n' "$TEAMMATE_GEMINI_API_KEY" >> /opt/teammate/.env
          fi

          # TM-03b brain: Claude Code as its own locked-down user, only when both tokens exist.
          if [ -n "${TEAMMATE_CLAUDE_TOKEN:-}" ] && [ -n "${TEAMMATE_GITHUB_TOKEN:-}" ]; then
            command -v gh >/dev/null || apt-get install -y gh
            command -v python3 >/dev/null || apt-get install -y python3
            # TM-31: builds on this server (build worktree) install the Python packages with uv; uv fetches its own
            # Python 3.11 into the brain's home on first use. Pinned, installed once, system-wide (read-only to the brain).
            command -v uv >/dev/null || (curl -LsSf https://astral.sh/uv/0.8.22/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh) || echo "uv not installed: builds go to the cloud"
            id teammate-brain >/dev/null 2>&1 || useradd --system --create-home --home-dir /var/lib/teammate-brain --shell /usr/sbin/nologin teammate-brain
            chmod 700 /var/lib/teammate-brain
            # Code and browser must be readable by the brain's user (the umask above keeps .env files private).
            (umask 022 && cd /opt/teammate/brain && npm ci --omit=dev --no-audit --no-fund)
            (umask 022 && cd /opt/teammate/brain && PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium) \
              || echo "brain: browser install failed; previews stay off"
            chmod -R a+rX /opt/teammate/brain /opt/pw-browsers 2>/dev/null || true
            chmod a+x /opt/teammate   # enter only; /opt/teammate/.env and brain.env stay root-only (600)
            chown -R root:root /opt/teammate/brain/hooks && chmod 755 /opt/teammate/brain/hooks/pre-push
            {
              printf 'TEAMMATE_API_TOKEN=%s\nTEAMMATE_API=http://127.0.0.1:8790\nTEAMMATE_BRAIN_PORT=8791\n' "$TEAMMATE_API_TOKEN"
              printf 'TEAMMATE_BRAIN_PROJECTS=mercon=aprodac/MERCON@ilan,mesiri=aprodac/mesiri.ai@main\n'
              # Mercon dev sites and the Mesiri dashboard (Mesiri has no dev site); never this server's own
              # local addresses. Screenshots only look, signed in with a test account, never a real user's.
              printf 'TEAMMATE_BRAIN_SCREENSHOT_HOSTS=dev.mercon.tech,track-dev.mercon.tech,app.whatsapp.mesiri.ai\n'
              trim() { printf %s "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
              if [ -n "${TEAMMATE_DEV_LOGIN_MESIRI_USER:-}" ] && [ -n "${TEAMMATE_DEV_LOGIN_MESIRI_PASSWORD:-}" ]; then
                printf 'TEAMMATE_DEV_LOGIN_MESIRI_HOST=app.whatsapp.mesiri.ai\nTEAMMATE_DEV_LOGIN_MESIRI_USER=%s\nTEAMMATE_DEV_LOGIN_MESIRI_PASSWORD=%s\n' \
                  "$(trim "$TEAMMATE_DEV_LOGIN_MESIRI_USER")" "$(trim "$TEAMMATE_DEV_LOGIN_MESIRI_PASSWORD")"
              fi
              if [ -n "${TEAMMATE_DEV_LOGIN_USER:-}" ] && [ -n "${TEAMMATE_DEV_LOGIN_PASSWORD:-}" ]; then
                printf 'TEAMMATE_DEV_LOGIN_HOST=dev.mercon.tech\nTEAMMATE_DEV_LOGIN_USER=%s\nTEAMMATE_DEV_LOGIN_PASSWORD=%s\n' \
                  "$(trim "$TEAMMATE_DEV_LOGIN_USER")" "$(trim "$TEAMMATE_DEV_LOGIN_PASSWORD")"
              fi
              # Pasted secrets can carry stray spaces / newlines, which break the login.
              printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\nGH_TOKEN=%s\n' \
                "$(printf %s "$TEAMMATE_CLAUDE_TOKEN" | tr -d '[:space:]')" "$(printf %s "$TEAMMATE_GITHUB_TOKEN" | tr -d '[:space:]')"
              # TM-14: extra Claude accounts. Only the account variables are accepted (never anything that
              # could change how the brain runs); a bad line is skipped and reported by number, never printed.
              if [ -n "${TEAMMATE_CLAUDE_ACCOUNTS_B64:-}" ]; then
                lineno=0
                printf %s "$TEAMMATE_CLAUDE_ACCOUNTS_B64" | base64 -d | while IFS= read -r line || [ -n "$line" ]; do
                  lineno=$((lineno + 1))
                  line="$(printf %s "$line" | tr -d '[:space:]')"
                  case "$line" in ''|'#'*) continue ;; esac
                  if printf %s "$line" | grep -Eq '^(CLAUDE_CODE_OAUTH_TOKEN|TEAMMATE_(ROUTINE|PARTNER)_[A-Z0-9]+_(URL|TOKEN))_[A-Z0-9]+=[A-Za-z0-9._:/+=-]+$' \
                    && ! printf %s "$line" | grep -Eq '^[A-Z0-9_]+_A='; then
                    printf '%s\n' "$line"
                  else
                    echo "brain: skipped line ${lineno} of TEAMMATE_CLAUDE_ACCOUNTS (not an account variable)" >&2
                  fi
                done
              fi
              printf 'GIT_AUTHOR_NAME=Teammate bot (Ilan)\nGIT_COMMITTER_NAME=Teammate bot (Ilan)\n'
              printf 'GIT_AUTHOR_EMAIL=ilan.usman.pro@gmail.com\nGIT_COMMITTER_EMAIL=ilan.usman.pro@gmail.com\n'
              clean() { printf %s "$1" | tr -d '[:space:]'; }
              if [ -n "${TEAMMATE_GITHUB_TOKEN_MESIRI:-}" ]; then
                printf 'TEAMMATE_GITHUB_TOKEN_MESIRI=%s\n' "$(clean "$TEAMMATE_GITHUB_TOKEN_MESIRI")"
              fi
              if [ -n "${TEAMMATE_ROUTINE_MESIRI_URL:-}" ] && [ -n "${TEAMMATE_ROUTINE_MESIRI_TOKEN:-}" ]; then
                printf 'TEAMMATE_ROUTINE_MESIRI_URL=%s\nTEAMMATE_ROUTINE_MESIRI_TOKEN=%s\n' "$(clean "$TEAMMATE_ROUTINE_MESIRI_URL")" "$(clean "$TEAMMATE_ROUTINE_MESIRI_TOKEN")"
              fi
              if [ -n "${TEAMMATE_PARTNER_MESIRI_URL:-}" ] && [ -n "${TEAMMATE_PARTNER_MESIRI_TOKEN:-}" ]; then
                printf 'TEAMMATE_PARTNER_MESIRI_URL=%s\nTEAMMATE_PARTNER_MESIRI_TOKEN=%s\n' "$(clean "$TEAMMATE_PARTNER_MESIRI_URL")" "$(clean "$TEAMMATE_PARTNER_MESIRI_TOKEN")"
              fi
              # TM-16: the production watch's AI screen reads every new exchange (Gemini, the listener's key;
              # kept out of Claude's environment by main.js).
              if [ -n "${TEAMMATE_GEMINI_API_KEY:-}" ]; then
                printf 'TEAMMATE_GEMINI_API_KEY=%s\n' "$(clean "$TEAMMATE_GEMINI_API_KEY")"
              fi
              # TM-16: the production watch (brain/src/prod_watch.js).
              if [ -n "${MESIRI_CLAUDE_OPS_TOKEN:-}" ]; then
                printf 'TEAMMATE_OPS_MESIRI_URL=https://api.whatsapp.mesiri.ai\nTEAMMATE_OPS_MESIRI_TOKEN=%s\n' "$(clean "$MESIRI_CLAUDE_OPS_TOKEN")"
              fi
              # TM-31: approved plans build here, in the build worktree (switched on 2 Nov 2026 in the Claude Code session).
              # Owners can still change it in the group: @bot build cloud | here (that choice wins over this default).
              printf 'TEAMMATE_BUILD_HERE=1\n'
              if [ -n "${TEAMMATE_ROUTINE_MERCON_URL:-}" ] && [ -n "${TEAMMATE_ROUTINE_MERCON_TOKEN:-}" ]; then
                printf 'TEAMMATE_ROUTINE_MERCON_URL=%s\nTEAMMATE_ROUTINE_MERCON_TOKEN=%s\n' \
                  "$(printf %s "$TEAMMATE_ROUTINE_MERCON_URL" | tr -d '[:space:]')" "$(printf %s "$TEAMMATE_ROUTINE_MERCON_TOKEN" | tr -d '[:space:]')"
              fi
            } > /opt/teammate/brain.env
            sed "s#/usr/bin/node#$(command -v node)#" /opt/teammate/deploy/teammate-brain.service > /etc/systemd/system/teammate-brain.service
            systemctl daemon-reload
            systemctl enable teammate-brain
            # TM-51 (3 Nov: two deploys in 5 minutes cut off [209] and [210] twice): a restart kills a build running on
            # this server, so wait until none is running (up to 45 min; the brain's /health lists them). The new code is
            # already on disk; the running process keeps its loaded copy until the restart. "now" skips the wait.
            if [ "${RESTART_NOW:-false}" != "true" ] && systemctl is-active --quiet teammate-brain; then
              for i in $(seq 1 90); do
                building="$(curl -fsS -m 5 http://127.0.0.1:8791/health 2>/dev/null | python3 -c 'import json,sys; print(" ".join(f"[{b}]" for b in json.load(sys.stdin).get("building", [])))' 2>/dev/null || true)"
                [ -z "$building" ] && break
                [ "$i" = 1 ] && echo "brain: waiting for the build(s) running here to finish: $building"
                sleep 30
              done
              [ -n "$building" ] && echo "brain: still building after 45 min ($building); restarting anyway (it resumes them)"
            fi
            systemctl restart teammate-brain
            printf 'TEAMMATE_BRAIN_URL=http://127.0.0.1:8791\n' >> /opt/teammate/.env
            echo "brain: on"
          else
            systemctl disable --now teammate-brain 2>/dev/null || true
            echo "brain: off (add TEAMMATE_CLAUDE_TOKEN and TEAMMATE_GITHUB_TOKEN secrets to switch it on)"
          fi

          sed "s#/usr/bin/node#$(command -v node)#" /opt/teammate/deploy/teammate.service > /etc/systemd/system/teammate.service
          systemctl daemon-reload
          systemctl enable teammate
          systemctl restart teammate

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8790/health; then echo; break; fi
            sleep 1
          done
          systemctl is-active teammate || { journalctl -u teammate -n 50 --no-pager; exit 1; }

          # Nightly backup of the inbox, requests, media and session (TM-08), plus one now.
          chmod 700 /opt/teammate/deploy/backup.sh
          cp /opt/teammate/deploy/teammate-backup.service /opt/teammate/deploy/teammate-backup.timer /etc/systemd/system/
          systemctl daemon-reload
          systemctl enable --now teammate-backup.timer
          systemctl start teammate-backup.service && journalctl -u teammate-backup -n 3 --no-pager -o cat

          # nginx: add the /teammate/ location to the api.whatsapp.mesiri.ai
          # HTTPS server once. Backed up, tested, rolled back if nginx -t fails.
          CONF=$(grep -rl "server_name api.whatsapp.mesiri.ai" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -1 || true)
          if [ -z "$CONF" ]; then echo "::error::no nginx config for api.whatsapp.mesiri.ai found"; exit 1; fi
          CONF=$(readlink -f "$CONF")
          if ! grep -q "location ^~ /teammate/" "$CONF"; then
            cp "$CONF" "/root/$(basename "$CONF").bak.$(date +%s)"
            python3 - "$CONF" /opt/teammate/deploy/nginx-location.conf << 'PY'
          import sys
          conf, snippet = sys.argv[1], open(sys.argv[2]).read()
          text = open(conf).read()
          anchor = "    location / {"
          if anchor not in text:
              sys.exit("could not find '    location / {' in " + conf)
          open(conf, "w").write(text.replace(anchor, snippet + anchor, 1))
          PY
            if nginx -t; then
              systemctl reload nginx
              echo "nginx: /teammate/ added"
            else
              cp "$(ls -t /root/$(basename "$CONF").bak.* | head -1)" "$CONF"
              echo "::error::nginx -t failed; config restored"
              exit 1
            fi
          else
            echo "nginx: /teammate/ already present"
          fi
          ENDSSH

      # 3 Nov: "deployed" is not "running": the brain must still be up 30 s after the restart, not restarting in a loop.
      - name: The bot stays up after the restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sleep 30
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" '
            for unit in teammate-brain teammate; do
              systemctl list-unit-files "$unit.service" >/dev/null 2>&1 || continue
              state=$(systemctl is-active "$unit" || true)
              restarts=$(systemctl show -p NRestarts --value "$unit" 2>/dev/null || echo 0)
              since=$(systemctl show -p ActiveEnterTimestampMonotonic --value "$unit")
              now=$(cat /proc/uptime | cut -d" " -f1 | cut -d. -f1)
              up=$(( now - since / 1000000 ))
              echo "$unit: $state, up ${up}s, restarts $restarts"
              if [ "$state" != "active" ] || [ "$up" -lt 25 ]; then
                echo "::error::$unit is not staying up after the deploy:"
                journalctl -u "$unit" --since "2 minutes ago" --no-pager | tail -20
                exit 1
              fi
            done'

      - name: Check from outside
        run: |
          sleep 2
          curl -fsS https://api.whatsapp.mesiri.ai/teammate/health
          echo
          echo "### Teammate listener deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: link the spare number with \`python3 teammate/inbox.py pair <phone>\` (see teammate/README.md)." >> "$GITHUB_STEP_SUMMARY"
