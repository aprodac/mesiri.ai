name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy can run at a time. Never cancel an in-progress deploy;
# let it finish so the VPS is never left in a half-deployed state.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Fast Python sanity check ────────────────────────────────────────────────
  # Runs the unit suite (fakes only, no docker) so a bad push never reaches
  # the VPS. Mirrors the "unit" job in ci-python.yml.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONSAFEPATH: "1"
      TEST_PYTHONPATH: >-
        ${{ github.workspace }}/shared/contracts/src:${{ github.workspace }}/platform/ai/src:${{ github.workspace }}/backend/src:${{ github.workspace }}/apps/whatsapp-assistant/src:${{ github.workspace }}/apps/whatsapp-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv venv --python 3.11 --clear
      # The same extras production installs (workflow = langgraph, receipt =
      # jinja2 + the playwright package, no browser): tests of the workflow
      # graph and the receipt cards import them (19 Oct, runs 852-857 red).
      - run: uv pip install -e ".[dev,infra,providers,reports,workflow,receipt]"
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests (fakes only)
        env:
          PYTHONPATH: ${{ env.TEST_PYTHONPATH }}
          MESIRI_ENVIRONMENT: test
          MESIRI_OBJECT_STORAGE__PROVIDER: fake
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -P -m pytest \
            "$GITHUB_WORKSPACE/shared/contracts/tests" \
            "$GITHUB_WORKSPACE/platform/ai/tests" \
            "$GITHUB_WORKSPACE/backend/tests" \
            "$GITHUB_WORKSPACE/apps/whatsapp-assistant/tests" \
            "$GITHUB_WORKSPACE/scenarios" \
            --rootdir=/tmp \
            -ra -m "not integration and not provider" \
            --import-mode=importlib \
            -o asyncio_mode=auto

  # ── Build control-panel static assets ──────────────────────────────────────
  build-frontend:
    name: Build control panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @mesiri/control-panel build
      - uses: actions/upload-artifact@v4
        with:
          name: control-panel-dist
          path: apps/control-panel/dist/
          retention-days: 1
      # INF-15: the same app built for the root of control.mesiri.ai.
      - run: pnpm --filter @mesiri/control-panel exec vite build --outDir dist-root
        env:
          VITE_BASE: /
      - uses: actions/upload-artifact@v4
        with:
          name: control-panel-root-dist
          path: apps/control-panel/dist-root/
          retention-days: 1

  # ── Build dashboard static assets ──────────────────────────────────────────
  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @mesiri/dashboard build
        env:
          VITE_API_URL: https://api.whatsapp.mesiri.ai
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/dashboard/dist/
          retention-days: 1

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build-frontend, build-dashboard]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download control panel build
        uses: actions/download-artifact@v4
        with:
          name: control-panel-dist
          path: frontend-dist/

      - name: Download control panel build (control.mesiri.ai)
        uses: actions/download-artifact@v4
        with:
          name: control-panel-root-dist
          path: control-dist/

      - name: Download dashboard build
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's key, retried: one 5 s scan failed 3 deploys in an hour on
          # 21 Oct while SSH itself was fine (a busy sshd drops some scans).
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then break; fi
            echo "ssh-keyscan attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "could not read the server's SSH key"; exit 1; }

      # ── Step 0: staging gate (INF-02, INF-03) ──────────────────────────────
      # This exact commit on staging first: a fresh copy of production's data,
      # the migrations run on it, the app started, the smoke test passed.
      # Any failure stops here and production is never touched. Run from a
      # file, not stdin, so the script's own commands can't read it.
      - name: Staging gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key infra/deploy/staging_deploy.sh "${VPS_USER}@${VPS_HOST}:/tmp/staging_deploy.sh"
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "bash /tmp/staging_deploy.sh ${{ github.sha }}"

      # SA-16: Claude's read-only control-plane API is off until this token is
      # set. From the GitHub secret MESIRI_CLAUDE_OPS_TOKEN (32+ characters),
      # passed on stdin so it never shows in a log; the restart below loads it.
      # Secret empty = the .env is left as it is.
      - name: Claude ops token
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CLAUDE_OPS_TOKEN: ${{ secrets.MESIRI_CLAUDE_OPS_TOKEN }}
        run: |
          if [ -z "${CLAUDE_OPS_TOKEN}" ]; then
            echo "MESIRI_CLAUDE_OPS_TOKEN secret not set; .env unchanged"
            exit 0
          fi
          scp -i ~/.ssh/deploy_key infra/deploy/set_env_value.py "${VPS_USER}@${VPS_HOST}:/tmp/set_env_value.py"
          printf '%s' "${CLAUDE_OPS_TOKEN}" | ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "python3 /tmp/set_env_value.py /opt/mesiri/.env MESIRI_CLAUDE_OPS_TOKEN && rm -f /tmp/set_env_value.py"

      # ── Step 1: update code + deps + run migrations + restart ──────────────
      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" bash -s << 'ENDSSH'
          set -euo pipefail

          REPO=/opt/mesiri
          VENV=${REPO}/.venv
          PYTHONPATH=${REPO}/shared/contracts/src:${REPO}/platform/ai/src:${REPO}/backend/src:${REPO}/apps/whatsapp-assistant/src
          export PYTHONPATH

          echo "──────────────────────────────────────────"
          echo "  Mesiri deploy  $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "──────────────────────────────────────────"

          echo "→ Pulling latest code..."
          cd "${REPO}"
          # Save current commit so we can revert if the new code fails to start.
          PREV_SHA=$(git rev-parse HEAD)
          echo "  rollback point: ${PREV_SHA}"

          git config credential.helper store
          printf 'https://x-access-token:%s@github.com\n' '${{ secrets.GH_TOKEN_FOR_VPS }}' \
            > /root/.git-credentials
          git fetch --prune origin
          git reset --hard origin/main

          echo "→ Installing Python dependencies..."
          ~/.local/bin/uv pip install --python ${VENV}/bin/python -e ".[infra,providers,workflow,receipt,reports]" --quiet

          echo "→ Clearing stale Python bytecode cache..."
          # Moved to run BEFORE migrations (2026-07-27): `git reset --hard`
          # only touches tracked files -- __pycache__/ is gitignored and
          # therefore persists untouched across every deploy on this
          # persistent checkout. `backend/migrations` was also missing from
          # this list entirely (only backend/src was covered), so a fix to a
          # migration file could silently keep executing as stale cached
          # bytecode: alembic would import the old compiled version even
          # though `git reset --hard` had already updated the .py source on
          # disk. Root cause of a real incident where a migration fix was
          # pushed, confirmed correct in the git history, and still failed
          # identically on every subsequent deploy attempt. Every root on
          # PYTHONPATH, plus migrations specifically, swept before anything
          # imports them.
          for SRC in "${REPO}/shared/contracts/src" "${REPO}/platform/ai/src" \
                     "${REPO}/backend/src" "${REPO}/backend/migrations" \
                     "${REPO}/apps/whatsapp-assistant/src"; do
            find "${SRC}" -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            find "${SRC}" -name '*.pyc' -delete 2>/dev/null || true
          done

          echo "→ Backing up the database before migrations (INF-04)..."
          # A restore point for every migration: the code rollback below
          # cannot undo a schema change. A failed backup stops the deploy
          # here, before anything has changed.
          bash "${REPO}/infra/deploy/backup_db.sh" pre-migrate

          echo "→ Running database migrations..."
          # From the repo root, not backend/: the settings loader reads `.env`
          # from the current directory, and /opt/mesiri/.env is the only one.
          # Run from backend/ it found none and silently connected with the
          # built-in development defaults (localhost:5432, dev password) --
          # which only worked because production used exactly those (INF-11).
          # alembic.ini resolves its paths from its own location (%(here)s).
          cd "${REPO}"
          # BE-03: once the app logs in as mesiri_app (no rights to change
          # tables), migrations use the owner login kept in
          # MESIRI_MIGRATION_POSTGRES__USER/PASSWORD. Environment variables
          # win over .env in the settings loader. Unset = the app login, as
          # before the switch (infra/deploy/app_db_login.sh).
          MIG_USER=$(grep -E '^MESIRI_MIGRATION_POSTGRES__USER=' .env | tail -1 | cut -d= -f2- | tr -d "'\\\" \r" || true)
          MIG_PASS=$(grep -E '^MESIRI_MIGRATION_POSTGRES__PASSWORD=' .env | tail -1 | cut -d= -f2- | tr -d "'\\\" \r" || true)
          if [ -n "${MIG_USER}" ]; then
            echo "  as the migration login (${MIG_USER})"
            MESIRI_POSTGRES__USER="${MIG_USER}" MESIRI_POSTGRES__PASSWORD="${MIG_PASS}" \
              ${VENV}/bin/alembic -c backend/alembic.ini upgrade head
          else
            ${VENV}/bin/alembic -c backend/alembic.ini upgrade head
          fi
          unset MIG_USER MIG_PASS

          # The app's port: 8000 unless the server's .env sets MESIRI_APP_PORT
          # (INF-11 -- the 2026-10 server already uses 8000 for another app).
          APP_PORT=$(grep -E '^MESIRI_APP_PORT=' "${REPO}/.env" | tail -1 | cut -d= -f2 | tr -d "'\\\" \r" || true)
          APP_PORT=${APP_PORT:-8000}

          echo "→ Restarting backend service..."
          systemctl restart mesiri

          echo "→ Health check..."
          # Up to 60 s: a cold start (bytecode cache cleared above, two uvicorn
          # workers importing the whole app) has been measured at ~14 s, so the
          # old 10 s window rolled back a healthy deploy on 2026-10-13.
          HEALTHY=false
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://127.0.0.1:${APP_PORT}/health/live > /dev/null; then
              echo "✓ Service is healthy (after ~$((i * 2)) s)"
              HEALTHY=true
              break
            fi
            echo "  waiting... (attempt ${i}/30)"
          done

          echo "── Startup logs (last 60 lines) ─────────"
          journalctl -u mesiri -n 60 --no-pager || true
          echo "─────────────────────────────────────────"

          if [ "${HEALTHY}" = "false" ]; then
            echo "✗ Health check failed"
            echo ""
            echo "── Diagnostics ──────────────────────────"
            echo "--- systemctl status mesiri ---"
            systemctl status mesiri --no-pager -l || true
            echo ""
            echo "--- journalctl -u mesiri (last 150 lines) ---"
            journalctl -u mesiri -n 150 --no-pager || true
            echo ""
            echo "--- disk space ---"
            df -h || true
            echo ""
            echo "--- memory ---"
            free -h || true
            echo ""
            echo "--- dependent services ---"
            systemctl is-active postgresql 2>&1 || true
            systemctl is-active redis-server 2>&1 || true
            echo "──────────────────────────────────────────"
            echo ""
            echo "Reverting to ${PREV_SHA}"
            cd "${REPO}"
            git reset --hard "${PREV_SHA}"
            ~/.local/bin/uv pip install --python ${VENV}/bin/python -e ".[infra,providers,workflow,receipt,reports]" --quiet
            systemctl restart mesiri
            # Same cold-start allowance as the health check above: a fixed
            # 3 s sleep reported "rollback failed" for a rollback that worked.
            ROLLED_BACK=false
            for i in $(seq 1 30); do
              sleep 2
              if curl -sf http://127.0.0.1:${APP_PORT}/health/live > /dev/null; then
                ROLLED_BACK=true
                break
              fi
            done
            if [ "${ROLLED_BACK}" = "true" ]; then
              echo "✓ Rollback succeeded — old version is live"
            else
              echo "✗ Rollback also failed — service may be down"
              echo ""
              echo "── Post-rollback diagnostics ────────────"
              echo "--- systemctl status mesiri ---"
              systemctl status mesiri --no-pager -l || true
              echo ""
              echo "--- journalctl -u mesiri (last 150 lines) ---"
              journalctl -u mesiri -n 150 --no-pager || true
              echo "──────────────────────────────────────────"
            fi
            exit 1
          fi

          # ── Step 1b: ARQ ingress worker (separate process from mesiri) ────
          # Installed here, not just left as a repo file, because it was
          # missed on the deploy that introduced it: the web process passed
          # its health check and looked fully deployed, but nothing was
          # consuming the Redis queue it had started writing to -- messages
          # got a typing indicator (that fires independently) and then
          # silently vanished, invisible even in the control plane, since
          # message_store.save() only happens once a worker actually
          # processes the job. `cp` (not a one-time install) so a future
          # change to the unit file itself also lands on every deploy.
          echo "→ Installing/refreshing mesiri-worker service..."
          cp "${REPO}/infra/mesiri-worker.service" /etc/systemd/system/mesiri-worker.service
          systemctl daemon-reload
          systemctl enable mesiri-worker
          systemctl restart mesiri-worker

          echo "→ Worker health check..."
          WORKER_HEALTHY=false
          for i in 1 2 3 4 5; do
            sleep 2
            if systemctl is-active --quiet mesiri-worker; then
              WORKER_HEALTHY=true
              break
            fi
            echo "  waiting... (attempt ${i}/5)"
          done

          echo "── Worker startup logs (last 40 lines) ───"
          journalctl -u mesiri-worker -n 40 --no-pager || true
          echo "─────────────────────────────────────────"

          if [ "${WORKER_HEALTHY}" = "false" ]; then
            echo "✗ Worker failed to start"
            echo ""
            echo "── Worker diagnostics ───────────────────"
            systemctl status mesiri-worker --no-pager -l || true
            echo ""
            journalctl -u mesiri-worker -n 150 --no-pager || true
            echo "──────────────────────────────────────────"
            echo ""
            # Deliberately not rolled back to PREV_SHA: mesiri (the webhook/
            # API process) is confirmed healthy above, so reverting it would
            # throw away good backend code over a worker-only failure. This
            # still fails the job (see Notify failure below) so the gap is
            # never silent again -- messages will queue in Redis rather than
            # being replied to until this is fixed, same as right now.
            exit 1
          fi

          # ── Step 1c: scheduled jobs (INF-05, INF-06) ──────────────────────
          # Unit files live in the repo and are copied on every deploy, like
          # the worker's. Nightly DB backup, the timeline projector, and the
          # DPR PDF render (renders only; sending is the app's own tick).
          echo "→ Installing/refreshing timers..."
          for UNIT in mesiri-backup mesiri-timeline mesiri-dpr-render; do
            cp "${REPO}/infra/${UNIT}.service" "${REPO}/infra/${UNIT}.timer" /etc/systemd/system/
          done
          systemctl daemon-reload
          for UNIT in mesiri-backup mesiri-timeline mesiri-dpr-render; do
            systemctl enable --now "${UNIT}.timer"
          done
          systemctl list-timers --no-pager 'mesiri-*' || true

          echo "──────────────────────────────────────────"
          echo "  Backend deploy complete (mesiri + mesiri-worker)"
          echo "──────────────────────────────────────────"

          # ── Step 1d: smoke test (INF-04) ─────────────────────────────────
          # Beyond "is it up": the deployed build is live, photos go to real
          # storage, Meta's webhook handshake works, the queue worker ticks.
          # A failure fails the job (and notifies) without rolling back.
          bash "${REPO}/infra/deploy/smoke_test.sh" "$(git -C "${REPO}" rev-parse --short HEAD)" "http://127.0.0.1:${APP_PORT}"
          ENDSSH

      # ── Step 2: sync static frontend ───────────────────────────────────────
      - name: Upload control panel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend-dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/mesiriadmin/"

          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "chown -R www-data:www-data /var/www/mesiriadmin/"

          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "mkdir -p /var/www/mesiricontrol"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            control-dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/mesiricontrol/"

          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "chown -R www-data:www-data /var/www/mesiricontrol/"

      # INF-15: control.mesiri.ai. Waits (no-op) until its DNS reaches this
      # server, then gets the certificate and redirects the old address.
      - name: Control panel address (nginx)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "bash /opt/mesiri/infra/deploy/nginx_control_panel.sh"

      - name: Upload dashboard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dashboard-dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/mesiriweb/"

          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "chown -R www-data:www-data /var/www/mesiriweb/"

      - name: Notify success
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          echo "✓ Production deploy finished at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  Commit: ${{ github.sha }}"
          echo "  Triggered by: ${{ github.actor }}"
          if [ -n "${WEBHOOK_URL}" ]; then
            curl -sf -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"✅ *Mesiri deployed* by \`${{ github.actor }}\`\nCommit: \`${{ github.sha }}\`\"}" || true
          fi

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          echo "✗ Deploy FAILED at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  Commit: ${{ github.sha }}"
          echo "  Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "${WEBHOOK_URL}" ]; then
            curl -sf -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"🚨 *Mesiri deploy FAILED*\nActor: \`${{ github.actor }}\`\nCommit: \`${{ github.sha }}\`\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
          fi
