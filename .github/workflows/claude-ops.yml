name: Claude ops

# On-demand jobs that let a Claude Code cloud session (Ilan Usman, TM-12) reach the VPS and the WhatsApp bot
# without holding any secret itself: the secrets stay in GitHub, the session starts this workflow and reads
# its log. Owner-approved 19 Oct ("use the env from the Git actions").
#
#   vps-check         infra/deploy/vps_check.sh over SSH (read-only; INF-01, BE-30, BE-31, INF-09)
#   vps-backup-now    infra/deploy/backup_db.sh over SSH (writes a dump to /var/backups/mesiri; INF-06)
#   vps-staging       infra/deploy/staging_deploy.sh: staging on 127.0.0.1:8101 from origin/main (INF-02)
#   vps-app-login     infra/deploy/app_db_login.sh `text` = check | switch | rollback (BE-03; switch/rollback
#                     owner-approved 19 Oct)
#   vps-smoke         infra/deploy/smoke_test.sh against the live build (read-only; INF-04)
#   vps-perf          infra/deploy/perf_report.sh: where reply time goes, last `hours` (read-only; B-7)
#   vps-evening       infra/deploy/evening_report.sh: tonight's evening review messages (`text` = yyyy-mm-dd, read-only; WA-05)
#   bot-status        is the bot linked and receiving
#   bot-chats         chats with their labels (names only)
#   bot-test          send `text` to the Mesiri assistant's assistant-test chat and print its replies
#                     (text "choose:<n or title>" taps an option of its latest menu)
#   bot-recent-test   the assistant-test chat, last `hours`
#   bot-recent-team   the team group(s), last `hours` (Ilan Pro's posts and the team's)
#   bot-items         open requests in the request log
#   bot-label-test    label chat `text` (a jid) as assistant-test for mesiri
#   golden-live       the agent golden sets on the real model (`pytest -m live`, ARCH-02 gate; `text` = site |
#                     materials | empty for both). Uses TEAMMATE_GEMINI_API_KEY (approved by Ilan 22 Oct); no VPS.
#
# Never prints secrets; long digit runs (phone numbers) are cut to their last 4 digits. Customer groups are
# not readable through this workflow.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        required: true
        type: choice
        options: [vps-check, vps-backup-now, vps-staging, vps-app-login, vps-smoke, vps-perf, vps-evening, bot-status, bot-chats, bot-test, bot-recent-test, bot-recent-team, bot-items, bot-label-test, golden-live]
      text:
        description: "bot-test: the message (or choose:<n|title>); bot-label-test: the chat jid"
        required: false
        default: ""
      hours:
        description: "bot-recent-*, vps-perf: how many hours back"
        required: false
        default: "24"

concurrency:
  group: claude-ops-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        if: startsWith(inputs.task, 'vps-')
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's key, retried: one 5 s scan failed 3 deploys in an hour on
          # 21 Oct while SSH itself was fine (a busy sshd drops some scans).
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then break; fi
            echo "ssh-keyscan attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "could not read the server's SSH key"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        if: inputs.task == 'golden-live'
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install (golden-live)
        if: inputs.task == 'golden-live'
        run: |
          uv venv --python 3.11 --clear
          uv pip install -e ".[dev,infra,providers,reports,workflow,receipt]"

      - name: Run
        env:
          TASK: ${{ inputs.task }}
          TEXT: ${{ inputs.text }}
          HOURS: ${{ inputs.hours }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TEAMMATE_TOKEN: ${{ secrets.TEAMMATE_API_TOKEN }}
          TEAMMATE_PROJECT: mesiri
          GEMINI_API_KEY: ${{ inputs.task == 'golden-live' && secrets.TEAMMATE_GEMINI_API_KEY || '' }}
        run: |
          set -o pipefail
          mask() { sed -E 's/[0-9]{6,}([0-9]{4})/…\1/g'; }
          inbox() { python3 teammate/inbox.py "$@"; }
          case "$TASK" in
            vps-check)
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'bash -s' < infra/deploy/vps_check.sh 2>&1 | mask ;;
            vps-backup-now)
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'bash -s -- manual' < infra/deploy/backup_db.sh 2>&1
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'ls -la /var/backups/mesiri' ;;
            vps-staging)
              # Run from a file, not stdin: the script's own commands must not be able to read it.
              scp -i ~/.ssh/deploy_key infra/deploy/staging_deploy.sh "${VPS_USER}@${VPS_HOST}:/tmp/staging_deploy.sh"
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'bash /tmp/staging_deploy.sh' 2>&1 | mask ;;
            vps-app-login)
              case "$TEXT" in check|switch|rollback) ;; *) echo "text must be check, switch or rollback"; exit 2 ;; esac
              scp -i ~/.ssh/deploy_key infra/deploy/app_db_login.sh "${VPS_USER}@${VPS_HOST}:/tmp/app_db_login.sh"
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "bash /tmp/app_db_login.sh ${TEXT}" 2>&1 | mask ;;
            vps-smoke)
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
                'P=$(grep -E "^MESIRI_APP_PORT=" /opt/mesiri/.env | tail -1 | cut -d= -f2 | tr -dc 0-9); bash -s -- "$(git -C /opt/mesiri rev-parse --short HEAD)" "http://127.0.0.1:${P:-8000}"' \
                < infra/deploy/smoke_test.sh 2>&1 | mask ;;
            vps-perf)
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "bash -s -- $(printf '%s' "$HOURS" | tr -dc 0-9)" \
                < infra/deploy/perf_report.sh 2>&1 | mask ;;
            vps-evening)
              ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "bash -s -- $(printf '%s' "$TEXT" | tr -dc 0-9-)" \
                < infra/deploy/evening_report.sh 2>&1 | mask ;;
            bot-status) inbox status ;;
            bot-chats) inbox chats | mask ;;
            bot-test)
              if [[ "$TEXT" == choose:* ]]; then inbox test --choose "${TEXT#choose:}"; else inbox test "$TEXT"; fi | mask ;;
            bot-recent-test) inbox recent --role assistant-test --hours "$HOURS" --limit 200 | mask ;;
            bot-recent-team) inbox recent --role team --hours "$HOURS" --limit 200 | mask ;;
            bot-items) inbox items --status open ;;
            bot-label-test) inbox label "$TEXT" assistant-test --project mesiri ;;
            golden-live)
              T="$GITHUB_WORKSPACE/apps/whatsapp-assistant/tests/conversation"
              case "$TEXT" in
                site) FILES="$T/test_site_golden.py" ;;
                materials) FILES="$T/test_materials_golden.py" ;;
                "") FILES="$T/test_site_golden.py $T/test_materials_golden.py" ;;
                *) echo "text must be site, materials or empty"; exit 2 ;;
              esac
              W="$GITHUB_WORKSPACE"
              cd /tmp
              PYTHONPATH="$W/shared/contracts/src:$W/platform/ai/src:$W/backend/src:$W/apps/whatsapp-assistant/src:$W/apps/whatsapp-assistant" \
                "$W/.venv/bin/python" -P -m pytest $FILES --rootdir=/tmp -m live -s -q \
                --import-mode=importlib -o asyncio_mode=auto -p no:cacheprovider 2>&1 | mask ;;
          esac
