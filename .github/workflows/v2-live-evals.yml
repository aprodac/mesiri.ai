# Request 185: the v2 eval sets on the REAL model, on demand (Actions -> "v2 live evals" -> Run).
# Runs the module skills (labour, work, issues, expenses, site, reports) and the materials gate
# for one engine (v2 = google-genai loop, adk = Google ADK with whole-conversation memory) and one
# Gemini model, with the CI key (CI_GEMINI_API_KEY; the team bot's until that is set). Prints one line per case and the per-module score.
# Never part of a deploy; costs a few cents per run.
name: v2 live evals

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "v2 | adk"
        required: true
        default: "v2"
      model:
        description: "Gemini model"
        required: true
        default: "gemini-2.5-flash"

# One run at a time: two at once went over the key's 1M input tokens per minute (31 Oct).
concurrency:
  group: v2-live-evals
  cancel-in-progress: false

jobs:
  live-evals:
    name: v2 evals (${{ inputs.engine }}, ${{ inputs.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONSAFEPATH: "1"
      MESIRI_USAGE_LOG: /tmp/mesiri-gemini-usage.jsonl
      TEST_PYTHONPATH: >-
        ${{ github.workspace }}/shared/contracts/src:${{ github.workspace }}/platform/ai/src:${{ github.workspace }}/backend/src:${{ github.workspace }}/apps/whatsapp-assistant/src:${{ github.workspace }}/apps/whatsapp-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv venv --python 3.11 --clear
      - run: uv pip install -e ".[dev,infra,providers,reports,workflow,receipt]"
      - name: Module skills on the live model
        env:
          PYTHONPATH: ${{ env.TEST_PYTHONPATH }}
          MESIRI_ENVIRONMENT: test
          MESIRI_OBJECT_STORAGE__PROVIDER: fake
          GEMINI_API_KEY: ${{ secrets.CI_GEMINI_API_KEY || secrets.TEAMMATE_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          MESIRI_V2_ENGINE: ${{ inputs.engine }}
          MESIRI_LIVE_PACE_SECONDS: "4"
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -P -m pytest \
            "$GITHUB_WORKSPACE/apps/whatsapp-assistant/tests/agent_v2/test_module_skills_185.py" \
            --rootdir=/tmp -s -ra -m live --import-mode=importlib -o asyncio_mode=auto
      - name: Materials gate on the live model (v2 engine)
        if: ${{ always() && inputs.engine == 'v2' }}
        env:
          PYTHONPATH: ${{ env.TEST_PYTHONPATH }}
          MESIRI_ENVIRONMENT: test
          MESIRI_OBJECT_STORAGE__PROVIDER: fake
          GEMINI_API_KEY: ${{ secrets.CI_GEMINI_API_KEY || secrets.TEAMMATE_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          MESIRI_LIVE_PACE_SECONDS: "4"
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -P -m pytest \
            "$GITHUB_WORKSPACE/apps/whatsapp-assistant/tests/agent_v2/test_evals.py" \
            --rootdir=/tmp -s -ra -m live --import-mode=importlib -o asyncio_mode=auto
      - name: Report this run's Gemini spend to the team bot
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
          TEAMMATE_TOKEN: ${{ secrets.TEAMMATE_API_TOKEN }}
        run: .venv/bin/python scripts/report_ci_gemini_usage.py
