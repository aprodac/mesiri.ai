# Mesiri app, WhatsApp webhook and control panel (INF-12).
server {
    server_name api.whatsapp.mesiri.ai;
    location ^~ /mesiriadmin {
        alias /var/www/mesiriadmin/;
        try_files $uri $uri/ /mesiriadmin/index.html;
    }
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.whatsapp.mesiri.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.whatsapp.mesiri.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.whatsapp.mesiri.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.whatsapp.mesiri.ai;
    return 404; # managed by Certbot


}