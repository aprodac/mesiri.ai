# Mesiri app and WhatsApp webhook (INF-12). The control panel moved to
# https://control.mesiri.ai (INF-15); its old /mesiriadmin address redirects there.
server {
    server_name api.whatsapp.mesiri.ai;
    location ^~ /mesiriadmin {
        rewrite ^/mesiriadmin/?(.*)$ https://control.mesiri.ai/$1 permanent;
    }
    # Teammate inbox API (teammate/listener), token-protected by the app itself.
    location ^~ /teammate/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.whatsapp.mesiri.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.whatsapp.mesiri.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.whatsapp.mesiri.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.whatsapp.mesiri.ai;
    return 404; # managed by Certbot


}