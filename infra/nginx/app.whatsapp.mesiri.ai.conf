# Mesiri dashboard (INF-12).
server {
    server_name app.whatsapp.mesiri.ai;
    root /var/www/mesiriweb;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.whatsapp.mesiri.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.whatsapp.mesiri.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = app.whatsapp.mesiri.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.whatsapp.mesiri.ai;
    return 404; # managed by Certbot


}